<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strush Blog</title> 

    <!-- Meta tag e link -->
    <meta name="application-name" content="Strush">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="assets/immagini/pittogramma_trasp.png" type="image/png">
    
    <!-- Stili globali -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Placeholders -->
    <div id="cursor-placeholder"></div>
<!-- Navbar (componente: components/navbar.html) -->
<div id="navbar-placeholder" style="height: 70px;"></div>
    
    <main>
        <div class="container">
            <!-- Contenuto Articolo Principale -->
            <div id="article-content" class="article-container">
                <p style="text-align: center; color: white; padding: 5rem 0;">Caricamento articolo...</p>
            </div>
            
            <!-- Altri Articoli -->
            <div id="other-articles-section" class="other-articles-container" style="display: none;">
                <h3 class="other-articles-title">Leggi anche</h3>
                <div class="blog-grid" id="other-articles-grid">
                    <!-- Le card degli altri articoli verranno inserite qui -->
                </div>
            </div>
        </div>
    </main>
    <style>
        .article-container { max-width: 800px; margin: 0 auto; padding: 3rem 0; }
        
        /* === MODIFICA 1: Stile per il link "Torna al Blog" === */
        .back-to-blog-top {
            display: inline-block;
            margin-bottom: 2rem; /* Spazio prima del titolo */
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-to-blog-top:hover {
            color: var(--secondary);
            transform: translateX(-4px);
        }
        
        .article-header { text-align: center; margin-bottom: 2rem; }
        .article-category { display: inline-block; background-color: #E6F2F5; color: var(--text2); padding: 4px 12px; border-radius: 16px; font-size: 14px; font-weight: 500; margin-bottom: 1rem; }
        .article-title { margin-bottom: 1rem; }
        .article-meta { display: flex; justify-content: center; gap: 1rem; color: var(--text2); margin-bottom: 2rem; }
        .article-image { width: 100%; height: auto; max-height: 450px; object-fit: cover; border-radius: var(--border-radius-lg); margin-bottom: 3rem; box-shadow: 0 8px 20px rgba(148, 149, 234, 0.2); }
        .article-body { font-size: 1.1rem; line-height: 1.8; color: var(--text); }
        .article-body p { margin-bottom: 1.5rem; }
        
        /* Stili per la sezione "Leggi anche" */
        .other-articles-container {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 4rem;
            padding-top: 3rem;
            /* === MODIFICA 2: Aggiunto spazio sotto === */
            padding-bottom: 3rem; 
        }
        .other-articles-title { text-align: center; margin-bottom: 2rem; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    </style>

    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ... (lo script JavaScript rimane identico, le modifiche sono solo in HTML e CSS) ...
        const SUPABASE_URL = 'https://ummmgdqnrbppgphfyqta.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtbW1nZHFucmJwcGdwaGZ5cXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1MTM0MTksImV4cCI6MjA3MTA4OTQxOX0.rP0FYn1BOXuZNQiaq6y3qTbieXR3RC0M8mNKbPFBxPo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadOtherArticles(currentPostId) {
            const otherArticlesGrid = document.getElementById('other-articles-grid');
            
            const { data: otherPosts, error } = await supabaseClient
                .from('posts')
                .select('*')
                .neq('id', currentPostId)
                .limit(3);

            if (error || !otherPosts || otherPosts.length === 0) {
                return; 
            }

            document.getElementById('other-articles-section').style.display = 'block';

            otherPosts.forEach(post => {
                const excerpt = post.content.substring(0, 80) + '...';
                const postDate = new Date(post.created_at).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
                
                const cardHTML = `
                    <a href="articolo.html?slug=${post.slug}" class="article-card">
                        <div class="card-image"><img src="${post.image_url}" alt="${post.title}"></div>
                        <div class="card-content">
                            <span class="card-category">${post.category}</span>
                            <h4>${post.title}</h4>
                            <p class="card-excerpt" style="font-size: 0.9em;">${excerpt}</p>
                            <div class="card-meta" style="font-size: 0.8em; margin-top: auto;">
                                <span>${post.author}</span><span>•</span><span>${postDate}</span>
                            </div>
                        </div>
                    </a>`;
                otherArticlesGrid.innerHTML += cardHTML;
            });
        }

        async function loadSingleArticle() {
            const articleContainer = document.getElementById('article-content');
            const urlParams = new URLSearchParams(window.location.search);
            const postSlug = urlParams.get('slug');

            if (!postSlug) {
                articleContainer.innerHTML = '<p style="color:red; text-align:center;">Articolo non specificato.</p>';
                return;
            }

            const { data: post, error } = await supabaseClient
                .from('posts').select('*').eq('slug', postSlug).single();

            if (error || !post) {
                articleContainer.innerHTML = '<p style="color:red; text-align:center;">Oops! Articolo non trovato.</p>';
                return;
            }

            document.title = `${post.title} | Strush Blog`;
            const postDate = new Date(post.created_at).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
            const formattedContent = post.content.split('\n').map(p => `<p>${p}</p>`).join('');

            // === MODIFICA 3: Spostato il link "Torna al Blog" qui sopra ===
            const articleHTML = `
                <a href="blog.html" class="back-to-blog-top"><i class="fas fa-arrow-left"></i> Torna al Blog</a>
                
                <div class="article-header">
                    <span class="article-category">${post.category}</span>
                    <h1 class="article-title">${post.title}</h1>
                    <div class="article-meta">
                        <span>Di ${post.author}</span>
                        <span>•</span>
                        <span>${postDate}</span>
                    </div>
                </div>
                <img src="${post.image_url}" alt="${post.title}" class="article-image">
                <div class="article-body">${formattedContent}</div>
            `;

            articleContainer.innerHTML = articleHTML;
            
            loadOtherArticles(post.id); 
        }

        document.addEventListener('DOMContentLoaded', loadSingleArticle);
    </script>
</body>
</html>
